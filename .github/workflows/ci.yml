name: SecOps Header Checker CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checker locally (Dry-run test)
        run: |
          python checker.py -i targets.txt -o security_report.json
          cat security_report.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build hardened Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: secops-header-checker:test

      - name: Test running containerized checker
        run: |
          docker run --rm secops-header-checker:test -i targets.txt -o security_report.json